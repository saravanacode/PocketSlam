[project]
name = "pocketslam"
version = "0.1.0"
description = "Device-agnostic monocular depth and SLAM from any phone camera over WebRTC."
readme = "README.md"
authors = [
    { name = "saravanacode", email = "saravanaperumalnataraj8@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "aiortc>=1.15.0",
    "foxglove-sdk>=0.29.0",
    "mcap>=1.5.0",
    "mcap-protobuf-support>=0.5.4",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "torch>=2.14.1",
]

[project.scripts]
pocketslam = "pocketslam.__main__:main"
pocketslam-recon = "pocketslam.recon.cli:main"
pocketslam-marker = "pocketslam.recon.cli:marker_main"
pocketslam-calibrate = "pocketslam.recon.cli:calibrate_main"

[project.optional-dependencies]
recon = [
    "addict>=2.4.0",
    "depth-anything-3==0.1.1",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

# Linux (Docker, CI) installs CPU-only torch wheels. The default PyPI wheels
# for Linux bundle CUDA libraries and add several GB to the image. macOS uses
# PyPI, whose wheels include MPS support.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
# depth-anything-3 0.1.1 (the `recon` extra) over-constrains its dependencies:
# - numpy<2: the inference code runs on numpy 2, which the rest of the project needs.
# - xformers: no macOS wheels; DA3 attention falls back to torch SDPA.
# - gsplat: only for the Gaussian-splatting head, which we do not use.
# - pycolmap, moviepy, open3d: only DA3's export helpers use them, and
#   depth/da3.py stubs that module out. pycolmap also bundles a second OpenMP
#   runtime that aborts the process next to torch's.
# The impossible marker removes a package from resolution entirely.
override-dependencies = [
    "numpy>=2",
    "xformers; sys_platform == 'never'",
    "gsplat; sys_platform == 'never'",
    "pycolmap; sys_platform == 'never'",
    "moviepy; sys_platform == 'never'",
    "open3d; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "C4",       # comprehensions
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls (we run an asyncio server)
    "T20",      # no print()
    "S",        # bandit security
    "PL",       # pylint subset
    "NPY",      # numpy
    "PERF",     # performance
    "D",        # docstrings
]
# D100/D104/D105/D107: module, package, magic-method and __init__ docstrings add
# noise without information. PLR0913: pipeline constructors take many collaborators.
ignore = ["D100", "D104", "D105", "D107", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]
"scripts/**" = ["T20", "D"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
cache_dir = ".cache/mypy"

# Optional `recon` extra; untyped and may be absent in the default environment.
[[tool.mypy.overrides]]
module = ["depth_anything_3.*", "cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
asyncio_mode = "auto"
cache_dir = ".cache/pytest"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: needs a CUDA or MPS device",
    "slow: takes more than 5 s",
]

[tool.importlinter]
root_package = "pocketslam"

[[tool.importlinter.contracts]]
name = "core depends on nothing inside pocketslam"
type = "forbidden"
source_modules = ["pocketslam.core"]
forbidden_modules = [
    "pocketslam.server", "pocketslam.transport", "pocketslam.depth",
    "pocketslam.slam", "pocketslam.viz", "pocketslam.record", "pocketslam.pipeline",
    "pocketslam.recon", "pocketslam.calib",
]

[[tool.importlinter.contracts]]
name = "processing modules are independent"
type = "independence"
modules = [
    "pocketslam.transport", "pocketslam.depth", "pocketslam.slam", "pocketslam.viz",
    "pocketslam.record", "pocketslam.calib",
]

[[tool.importlinter.contracts]]
name = "nothing imports the server"
type = "forbidden"
source_modules = [
    "pocketslam.core", "pocketslam.transport", "pocketslam.depth",
    "pocketslam.slam", "pocketslam.viz", "pocketslam.record", "pocketslam.pipeline",
    "pocketslam.recon", "pocketslam.calib",
]
forbidden_modules = ["pocketslam.server"]

[[tool.importlinter.contracts]]
name = "offline reconstruction stays out of the live server path"
type = "forbidden"
source_modules = [
    "pocketslam.server", "pocketslam.pipeline", "pocketslam.transport", "pocketslam.record",
]
forbidden_modules = ["pocketslam.recon"]
