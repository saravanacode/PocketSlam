name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.16"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run lint-imports --cache-dir .cache/import_linter
      - run: uv run scripts/check_structure.py
      - run: uv run pytest -m "not gpu and not slow"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: pocketslam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container health
        run: |
          docker run -d --name smoke -e POCKETSLAM_ALLOW_INSECURE=1 pocketslam:ci
          for _ in $(seq 1 30); do
            if docker exec smoke python -m pocketslam.healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
