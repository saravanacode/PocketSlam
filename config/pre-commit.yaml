# Local hooks run the exact tool versions pinned in uv.lock.
# Lives in config/ to keep the repo root clean, so install with:
#   uv run pre-commit install --config config/pre-commit.yaml
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: check-structure
        name: project structure
        entry: uv run scripts/check_structure.py
        language: system
        pass_filenames: false
        always_run: true
      - id: uv-lock
        name: uv.lock up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
